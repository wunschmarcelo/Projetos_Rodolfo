<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pequenos Guardiões Digitais</title><style>
:root{font-family:'Trebuchet MS',Arial,sans-serif;color:#19314a;background:#edf7ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#1769b3,#6848c6);color:white;text-align:center;padding:25px 12px}h1{font-size:clamp(26px,5vw,42px);margin:5px}header p{font-size:19px}main{max-width:1000px;margin:auto;padding:18px}.score{background:#fff5cf;border-radius:16px;padding:13px;text-align:center;font-size:21px;font-weight:bold;margin-bottom:15px}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.tile{border:0;border-radius:20px;padding:23px 14px;background:white;box-shadow:0 4px 10px #0001;font-size:19px;cursor:pointer;color:#19314a;min-height:145px}.tile span{display:block;font-size:43px;margin-bottom:10px}.tile:hover,.choice:hover{outline:3px solid #ffbc36}.panel{background:white;border-radius:22px;padding:22px;box-shadow:0 5px 15px #0001;min-height:320px}.hidden{display:none}.question{font-size:clamp(23px,4vw,31px);font-weight:bold;text-align:center;line-height:1.35;margin:20px auto}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.choice{font-family:inherit;background:#e9f3ff;border:3px solid #c5e0ff;border-radius:16px;padding:18px;font-size:20px;font-weight:bold;cursor:pointer;min-height:75px}.choice:disabled{cursor:default;opacity:.85}.choice.correct{background:#d4f8df;border-color:#39a663}.choice.wrong{background:#ffe1e1;border-color:#d96969}.feedback{text-align:center;font-size:21px;font-weight:bold;min-height:55px;margin-top:18px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:15px}.action{background:#225fa9;color:white;border:0;border-radius:15px;padding:14px 23px;font-size:18px;font-weight:bold;cursor:pointer}.action.secondary{background:#e4ebf5;color:#213e5b}.progress{text-align:center;font-size:17px;color:#526479;font-weight:bold}.end{text-align:center;font-size:25px}.footer{text-align:center;color:#53667b;padding:18px;font-size:15px}@media(max-width:500px){.panel{padding:15px}.tile{min-height:125px}}:focus-visible{outline:4px solid #ff9e1a!important;outline-offset:3px}
</style></head><body><header><div style="font-size:50px" aria-hidden="true">🛡️💻📱</div><h1>Pequenos Guardiões Digitais</h1><p>Aprenda a usar a tecnologia com cuidado e segurança!</p></header><main><div class="score" aria-live="polite">⭐ Estrelas conquistadas: <span id="stars">0</span></div><section id="home"><h2 style="text-align:center">Escolha uma aventura!</h2><div class="menu" id="menu"></div></section><section id="game" class="panel hidden" aria-live="polite"><div class="progress" id="progress"></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button id="next" class="action hidden">Próximo desafio ➜</button><button id="back" class="action secondary">⌂ Voltar ao início</button></div></section></main><div class="footer">Aprender, brincar e se proteger! • Atividade para o 2º ano do Ensino Fundamental</div><script>
const games=[
{icon:'🚦',title:'Pode ou não pode?',intro:'Descubra o que é seguro fazer!',items:[
['Posso contar minha senha para um desconhecido?',['🟢 Pode','🔴 Não pode'],1,'Muito bem! Sua senha é um segredo.'],
['Posso pedir ajuda a um adulto de confiança?',['🟢 Pode','🔴 Não pode'],0,'Isso! Pedir ajuda é uma boa escolha.'],
['Posso clicar em qualquer link que aparece na tela?',['🟢 Pode','🔴 Não pode'],1,'Cuidado! Pergunte a um adulto antes de clicar.'],
['Posso usar o tablet com as mãos limpas e secas?',['🟢 Pode','🔴 Não pode'],0,'Isso ajuda a cuidar do aparelho!'],
['Posso conversar com desconhecidos na internet sem avisar um adulto?',['🟢 Pode','🔴 Não pode'],1,'Avise um adulto de confiança.']
]},
{icon:'🔐',title:'Proteja seus dados!',intro:'O que devemos guardar com cuidado?',items:[
['Um jogo pede seu endereço de casa. O que fazer?',['Contar o endereço','Não contar e pedir ajuda'],1,'Seu endereço é uma informação pessoal.'],
['Você criou uma senha. O que deve fazer?',['Guardar em segredo','Mostrar para a turma'],0,'Senhas devem ficar protegidas.'],
['Um site pede seu telefone. O que fazer?',['Digitar sozinho','Perguntar a um adulto'],1,'Sempre peça ajuda antes de informar dados.'],
['Um colega quer publicar sua foto. O que fazer?',['Pedir ajuda a um adulto antes','Publicar sem pensar'],0,'Fotos também merecem cuidado.'],
['Um jogo pergunta seu nome completo. O que fazer?',['Informar logo','Consultar um adulto'],1,'Muito bem! Proteja suas informações.']
]},
{icon:'🔎',title:'Detetives Digitais',intro:'Encontre a atitude mais segura!',items:[
['O computador está perto de um copo de água. O que fazer?',['Afastar a bebida','Deixar a bebida ali'],0,'Líquidos podem estragar os aparelhos.'],
['Apareceu uma mensagem estranha na tela. O que fazer?',['Pedir ajuda','Responder imediatamente'],0,'Você é um ótimo detetive!'],
['Você terminou de usar o tablet da escola. O que fazer?',['Guardar com cuidado','Deixar no chão'],0,'Assim todos podem usar o tablet depois.'],
['Uma pessoa desconhecida pede uma foto sua. O que fazer?',['Enviar a foto','Não enviar e avisar um adulto'],1,'Você protegeu sua privacidade!'],
['Seu colega quer mexer nos arquivos de outra pessoa. O que fazer?',['Respeitar os arquivos','Abrir tudo sem permissão'],0,'Respeitar os outros também é segurança.']
]},
{icon:'🏆',title:'Quiz da Segurança',intro:'Mostre o que você aprendeu!',items:[
['Qual é um dado pessoal?',['Meu endereço','Minha cor favorita'],0,'O endereço deve ser protegido.'],
['Quem pode ajudar quando algo estranho acontece online?',['Um adulto de confiança','Um desconhecido na internet'],0,'Pedir ajuda é muito importante.'],
['Como devemos carregar um tablet?',['Com cuidado e as duas mãos','Pela ponta da tela'],0,'Boa escolha!'],
['O que fazer antes de instalar um aplicativo?',['Pedir autorização','Instalar qualquer um'],0,'Aplicativos precisam ser escolhidos com cuidado.'],
['Se uma mensagem assustar você, o que fazer?',['Guardar segredo e continuar','Parar e contar a um adulto'],1,'Você não precisa resolver isso sozinho.']
]},
{icon:'🧭',title:'Caminho Seguro',intro:'Ajude Bia a fazer boas escolhas!',items:[
['Bia ganhou um tablet. Qual é o primeiro cuidado?',['Usar com as mãos limpas','Comer sobre a tela'],0,'Bia começou muito bem!'],
['Um jogo pede a senha de Bia. O que ela faz?',['Pede ajuda a um adulto','Conta a senha para qualquer pessoa'],0,'Bia protegeu sua senha!'],
['Chegou uma mensagem de alguém que Bia não conhece.',['Bia responde','Bia avisa um adulto'],1,'Bia fez uma escolha segura!'],
['Bia encontrou um anúncio com um prêmio incrível.',['Clica sem pensar','Pede ajuda antes de clicar'],1,'Nem toda promessa na internet é verdadeira.'],
['Bia terminou sua atividade.',['Guarda o tablet com cuidado','Joga o tablet no sofá'],0,'Parabéns! Bia completou sua aventura.']
]}];
let current=0,index=0,earned=0,locked=false,completed=new Set();
const el=id=>document.getElementById(id);function updateScore(){el('stars').textContent=earned}function menu(){el('menu').innerHTML='';games.forEach((g,i)=>{const b=document.createElement('button');b.className='tile';b.innerHTML=`<span aria-hidden="true">${g.icon}</span><strong>${g.title}</strong><div style="font-size:15px;margin-top:7px">${completed.has(i)?'✅ Concluído!':g.intro}</div>`;b.onclick=()=>start(i);el('menu').appendChild(b)})}function home(){el('game').classList.add('hidden');el('home').classList.remove('hidden');menu()}function start(i){current=i;index=0;el('home').classList.add('hidden');el('game').classList.remove('hidden');render()}function render(){locked=false;const g=games[current],item=g.items[index];el('progress').textContent=`${g.icon} ${g.title} • Desafio ${index+1} de ${g.items.length}`;el('question').textContent=item[0];el('feedback').textContent='';el('next').classList.add('hidden');el('choices').innerHTML='';item[1].forEach((answer,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=answer;b.onclick=()=>answerQuestion(j);el('choices').appendChild(b)})}function answerQuestion(j){if(locked)return;locked=true;const item=games[current].items[index],ok=j===item[2];Array.from(el('choices').children).forEach((b,k)=>{b.disabled=true;if(k===item[2])b.classList.add('correct');else if(k===j)b.classList.add('wrong')});if(ok){earned++;updateScore()}el('feedback').textContent=(ok?'⭐ Muito bem! ':'💡 Vamos aprender! ')+item[3];el('next').textContent=index===games[current].items.length-1?'Ver resultado 🎉':'Próximo desafio ➜';el('next').classList.remove('hidden')}function advance(){index++;if(index<games[current].items.length){render();return}completed.add(current);el('progress').textContent='Aventura concluída!';el('question').innerHTML='🎉 Parabéns, Guardião Digital!';el('choices').innerHTML='';el('feedback').textContent='Você aprendeu a cuidar de seus dados e dos aparelhos. Continue praticando!';el('next').textContent='Escolher outro jogo ➜';el('next').classList.remove('hidden');el('next').onclick=()=>{el('next').onclick=advance;home()}}el('next').onclick=advance;el('back').onclick=home;menu();updateScore();
</script></body></html>
