plugins { id 'com.android.application' }
android {
    namespace 'br.com.florescer'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.florescer'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    signingConfigs { debug { storeFile file("${rootProject.projectDir}/.local/debug.keystore") } }
    sourceSets { main { assets.srcDirs = [layout.buildDirectory.dir('generated/webAssets')] } }
}
tasks.register('prepareWebAssets', Sync) {
    from('../..') { include 'index.html', 'style.css', 'script.js' }
    into layout.buildDirectory.dir('generated/webAssets')
    // Android works offline: use the existing system-font fallbacks.
    doLast {
        def css = new File(destinationDir, 'style.css')
        css.text = css.text.replaceAll(/(?m)^@import[^;]+;\s*/, '')
    }
}
tasks.named('preBuild').configure { dependsOn 'prepareWebAssets' }
